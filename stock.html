<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="孤島Team目前可購買的龍舌蘭現貨植株。">
  <title>現貨販售｜孤島Team</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body class="stock-page">
  <header class="stock-hero">
    <a class="stock-brand" href="index.html">孤島Team</a>
    <nav class="stock-nav" aria-label="主要導覽">
      <a href="index.html">首頁</a>
      <a class="active" href="stock.html">現貨販售</a>
      <a href="event.html">近期活動</a>
    </nav>
    <div class="stock-title">
      <p>AVAILABLE NOW</p>
      <h1>現貨個體</h1>
      <span>每一株，都是時間與光的作品。</span>
    </div>
  </header>

  <main class="stock-main">
    <div class="stock-intro">
      <p>挑選喜歡的個體後，可透過 Instagram 私訊詢問。實際庫存與植株狀態以私訊確認為準。</p>
      <div class="stock-filter" id="stock-filter" aria-label="現貨篩選">
        <button class="active" data-filter="全部">全部</button>
        <button data-filter="現貨">現貨</button>
        <button data-filter="已售出">已售出</button>
      </div>
    </div>

    <section id="product-grid" class="premium-product-grid" aria-live="polite"></section>
  </main>

  <footer class="stock-footer">© 2026 GUDAO TEAM</footer>

  <script src="products.js?v=5"></script>
  <script>
    const grid = document.querySelector('#product-grid');
    const filter = document.querySelector('#stock-filter');

    function renderProducts(status = '全部') {
      const rows = status === '全部'
        ? window.GUDAO_PRODUCTS
        : window.GUDAO_PRODUCTS.filter(item => item.status === status);

      grid.innerHTML = rows.map(item => `
        <article class="premium-product-card">
          <div class="product-image-wrap">
            <img src="${item.image}" alt="${item.name}" loading="lazy"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';">
            <div class="photo-fallback">PHOTO<br>${item.code}</div>
            <span class="product-status ${item.status === '現貨' ? 'is-available' : 'is-sold'}">${item.status}</span>
          </div>
          <div class="premium-product-body">
            <p class="product-code">${item.code}</p>
            <h2>${item.name}</h2>
            <p>${item.description}</p>
            <div class="product-meta">
              <span>${item.size}</span>
              <strong>${item.price}</strong>
            </div>
            ${item.status === '現貨'
              ? `<a class="product-contact" href="${item.instagram}" target="_blank" rel="noopener noreferrer">Instagram 私訊購買 <b>↗</b></a>`
              : `<span class="product-contact disabled">此個體已售出</span>`}
          </div>
        </article>
      `).join('');
    }

    filter.addEventListener('click', event => {
      if (!event.target.matches('button')) return;
      filter.querySelectorAll('button').forEach(button => button.classList.remove('active'));
      event.target.classList.add('active');
      renderProducts(event.target.dataset.filter);
    });

    renderProducts();
  </script>
<script src="site-data.js?v=5"></script></body>
</html>
