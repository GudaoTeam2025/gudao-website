<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#262C31">
  <title>現貨販售｜孤島</title>
  <link rel="stylesheet" href="style.css?v=12">
  <link rel="stylesheet" href="brand-system-v14.css?v=14">
  <link rel="stylesheet" href="contour-hero-v15.css?v=15">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <img src="assets/brand/logo.png" alt="孤島標誌">
      <span>孤島 GUDAO</span>
    </a>

    <button class="menu" type="button" aria-label="開啟選單" aria-expanded="false">☰</button>

    <nav aria-label="主要導覽">
      <a href="index.html">首頁</a>
      <a class="active" href="stock.html">現貨販售</a>
      <a href="event.html">近期活動</a>
      <a href="appreciation.html">孤島植賞</a>
      <a href="appreciation.html">周邊商品</a>
      <a href="raffle.html">孤島抽獎</a>
      <a class="ig" href="https://www.instagram.com/gudao.team/" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <p class="label">AVAILABLE NOW</p>
      <h1>現貨販售</h1>
      <p>每一株，都是時間與光的作品</p>
      <p>精心培育個體，歡迎您的挑選</p>
    </section>

    <section class="wrap section">
      <div class="toolbar">
        <p>有任何個體挑選或是培育問題，歡迎聯繫孤島IG</p>

        <div id="filters">
          <button class="active" data-f="全部">全部</button>
          <button data-f="現貨">現貨</button>
          <button data-f="已售出">已售出</button>
        </div>
      </div>

      <div id="product-grid" class="card-grid"></div>
    </section>

    <script src="products.js?v=7"></script>
    <script src="catalog.js?v=7"></script>
  </main>

  <footer>
    <img src="assets/brand/logo.png" alt="孤島標誌">
    <div>
      <b>PASSION TO THE ISLAND</b>
      <p>© 2026 GUDAO TEAM</p>
    </div>
  </footer>

  <script>
    const menuButton = document.querySelector('.menu');
    const navigation = document.querySelector('.site-header nav');

    menuButton?.addEventListener('click', () => {
      const isOpen = navigation.classList.toggle('open');
      menuButton.setAttribute('aria-expanded', String(isOpen));
    });
  </script>
</body>
</html>
