<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>現貨販售｜孤島Team</title><link rel="stylesheet" href="style.css?v=6"></head><body><header><a href="index.html">孤島Team</a><nav><a href="index.html">首頁</a><a href="stock.html">現貨販售</a><a href="event.html">近期活動</a><a href="https://www.instagram.com/gudao.team/" target="_blank" rel="noopener noreferrer">Instagram</a></nav><div class="title"><small>AVAILABLE NOW</small><h1>現貨個體</h1><p>每一株，都是時間與光的作品。</p></div></header><main><div class="intro"><p>挑選喜歡的個體後，可透過 Instagram 私訊詢問。</p><div id="filters"><button class="active" data-filter="全部">全部</button><button data-filter="現貨">現貨</button><button data-filter="已售出">已售出</button></div></div><section id="grid"></section></main><footer>© 2026 GUDAO TEAM</footer><script src="products.js?v=6"></script><script>const grid=document.querySelector('#grid');function render(f='全部'){const p=f==='全部'?GUDAO_PRODUCTS:GUDAO_PRODUCTS.filter(x=>x.status===f);grid.innerHTML=p.map(x=>`<article><div class="photo"><img src="${x.image}" alt="${x.name}" loading="lazy"><span>${x.status}</span></div><div class="body"><small>${x.code}</small><h2>${x.name}</h2><p>${x.description}</p><div class="meta"><i>${x.size}</i><b>${x.price}</b></div>${x.status==='現貨'?`<a href="https://www.instagram.com/gudao.team/" target="_blank">Instagram 私訊購買 ↗</a>`:'<em>此個體已售出</em>'}</div></article>`).join('')}document.querySelector('#filters').onclick=e=>{if(e.target.tagName!=='BUTTON')return;document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');render(e.target.dataset.filter)};render();</script></body></html>
