<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#262C31">
  <title>孤島植賞｜孤島 GUDAO</title>
  <link rel="stylesheet" href="style.css?v=12">
  <link rel="stylesheet" href="brand-system-v14.css?v=14">
  <link rel="stylesheet" href="contour-hero-v15.css?v=15">
  <link rel="stylesheet" href="appreciation.css?v=1">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <img src="assets/brand/logo.png" alt="孤島標誌">
      <span>孤島 GUDAO</span>
    </a>

    <button class="menu" type="button" aria-label="開啟選單" aria-expanded="false">☰</button>

    <nav aria-label="主要導覽">
      <a href="index.html">首頁</a>
      <a href="stock.html">植株選購</a>
      <a href="event.html">近期活動</a>
      <a class="active" href="appreciation.html">孤島植賞</a>
      <a href="merchandise.html">周邊商品</a>
      <a href="care.html">養護資訊</a>
      <a href="raffle.html">孤島抽獎</a>
      <a class="ig" href="https://www.instagram.com/gudao.team/" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
    </nav>
  </header>

  <main>
    <section class="page-hero appreciation-hero">
      <p class="label">GUDAO APPRECIATION</p>
      <h1>孤島植賞</h1>
      <p>看見每一株獨一無二的模樣</p>
      <p>記錄個體的表現、特色與成長，分享培育過程中的每一份驚喜</p>
    </section>

    <section class="wrap section">
      <div class="toolbar appreciation-toolbar">
        <p>左右滑動照片觀看個體細節，內容將持續更新。</p>
        <div id="appreciation-filters" class="filter-group" aria-label="植賞分類篩選"></div>
      </div>

      <div id="appreciation-grid" class="appreciation-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    <img src="assets/brand/logo.png" alt="孤島標誌">
    <div>
      <b>PASSION TO THE ISLAND</b>
      <p>© 2026 GUDAO TEAM</p>
    </div>
  </footer>

  <script src="appreciations.js?v=13"></script>
  <script>
    (() => {
      const ALLOWED_CATEGORIES = ['個體賞析', '培育紀錄'];
      const menuButton = document.querySelector('.menu');
      const navigation = document.querySelector('.site-header nav');
      const grid = document.querySelector('#appreciation-grid');
      const filters = document.querySelector('#appreciation-filters');

      const escapeHtml = value => String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

      const safeUrl = value => {
        try {
          const url = new URL(String(value ?? ''), window.location.href);
          return ['http:', 'https:'].includes(url.protocol) ? url.href : '#';
        } catch {
          return '#';
        }
      };

      const normalizedItems = (window.GUDAO_APPRECIATIONS || []).map((item, itemIndex) => {
        const category = ALLOWED_CATEGORIES.includes(item.category)
          ? item.category
          : '個體賞析';
        const sourceImages = Array.isArray(item.images) && item.images.length
          ? item.images
          : item.image
            ? [item.image]
            : [];
        return {
          ...item,
          id: `appreciation-${itemIndex}`,
          category,
          images: sourceImages.filter(Boolean).slice(0, 6)
        };
      });

      menuButton?.addEventListener('click', () => {
        const isOpen = navigation.classList.toggle('open');
        menuButton.setAttribute('aria-expanded', String(isOpen));
      });

      function imageSlides(item) {
        if (!item.images.length) {
          return '<div class="appreciation-fallback">GUDAO<br>APPRECIATION</div>';
        }
        return item.images.map((image, imageIndex) => `
          <figure class="appreciation-slide" data-slide="${imageIndex}" aria-hidden="${imageIndex !== 0}">
            <img
              src="${escapeHtml(image)}"
              alt="${escapeHtml(item.name)}，第 ${imageIndex + 1} 張照片"
              loading="lazy"
              draggable="false"
            >
          </figure>
        `).join('');
      }

      function galleryControls(item) {
        if (item.images.length <= 1) return '';
        return `
          <button class="gallery-arrow gallery-prev" type="button" aria-label="上一張照片">‹</button>
          <button class="gallery-arrow gallery-next" type="button" aria-label="下一張照片">›</button>
          <div class="gallery-status" aria-live="polite">
            <span class="gallery-counter">1 / ${item.images.length}</span>
          </div>
          <div class="gallery-dots" role="tablist" aria-label="選擇照片">
            ${item.images.map((_, index) => `
              <button
                class="gallery-dot ${index === 0 ? 'active' : ''}"
                type="button"
                role="tab"
                aria-label="第 ${index + 1} 張照片"
                aria-selected="${index === 0}"
                data-index="${index}"
              ></button>
            `).join('')}
          </div>
        `;
      }

      function renderAppreciations(category = '全部') {
        const items = category === '全部'
          ? normalizedItems
          : normalizedItems.filter(item => item.category === category);

        if (!items.length) {
          grid.innerHTML = '<div class="appreciation-empty">這個分類目前尚無內容。</div>';
          return;
        }

        grid.innerHTML = items.map(item => `
          <article class="appreciation-card">
            <div class="appreciation-gallery" data-gallery data-index="0" data-count="${item.images.length}">
              <div class="appreciation-track">
                ${imageSlides(item)}
              </div>
              <span class="appreciation-category">${escapeHtml(item.category)}</span>
              ${galleryControls(item)}
            </div>

            <div class="appreciation-body">
              <small>${escapeHtml(item.code)}</small>
              <h2>${escapeHtml(item.name)}</h2>
              <p>${escapeHtml(item.description)}</p>

              <dl class="appreciation-meta">
                <div><dt>培育</dt><dd>${escapeHtml(item.cultivation)}</dd></div>
                <div><dt>紀錄</dt><dd>${escapeHtml(item.record)}</dd></div>
              </dl>

              <a href="${escapeHtml(safeUrl(item.instagram))}" target="_blank" rel="noopener noreferrer">
                INSTAGRAM 查看更多 ↗
              </a>
            </div>
          </article>
        `).join('');

        initializeGalleries();
      }

      function initializeGalleries() {
        grid.querySelectorAll('[data-gallery]').forEach(gallery => {
          const slides = [...gallery.querySelectorAll('.appreciation-slide')];
          const dots = [...gallery.querySelectorAll('.gallery-dot')];
          const counter = gallery.querySelector('.gallery-counter');
          const count = slides.length;
          let index = 0;
          let touchStartX = null;
          let touchStartY = null;

          if (!count) return;

          const show = nextIndex => {
            index = (nextIndex + count) % count;
            gallery.dataset.index = String(index);
            slides.forEach((slide, slideIndex) => {
              const active = slideIndex === index;
              slide.classList.toggle('active', active);
              slide.setAttribute('aria-hidden', String(!active));
            });
            dots.forEach((dot, dotIndex) => {
              const active = dotIndex === index;
              dot.classList.toggle('active', active);
              dot.setAttribute('aria-selected', String(active));
            });
            if (counter) counter.textContent = `${index + 1} / ${count}`;
          };

          gallery.querySelector('.gallery-prev')?.addEventListener('click', () => show(index - 1));
          gallery.querySelector('.gallery-next')?.addEventListener('click', () => show(index + 1));
          dots.forEach(dot => dot.addEventListener('click', () => show(Number(dot.dataset.index))));

          gallery.addEventListener('touchstart', event => {
            const touch = event.changedTouches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
          }, { passive: true });

          gallery.addEventListener('touchend', event => {
            if (touchStartX === null || touchStartY === null || count <= 1) return;
            const touch = event.changedTouches[0];
            const deltaX = touch.clientX - touchStartX;
            const deltaY = touch.clientY - touchStartY;
            touchStartX = null;
            touchStartY = null;
            if (Math.abs(deltaX) < 45 || Math.abs(deltaX) <= Math.abs(deltaY)) return;
            show(deltaX < 0 ? index + 1 : index - 1);
          }, { passive: true });

          gallery.setAttribute('tabindex', '0');
          gallery.addEventListener('keydown', event => {
            if (event.key === 'ArrowLeft') show(index - 1);
            if (event.key === 'ArrowRight') show(index + 1);
          });

          slides.forEach(slide => {
            const image = slide.querySelector('img');
            image?.addEventListener('error', () => {
              slide.innerHTML = '<div class="appreciation-fallback">GUDAO<br>APPRECIATION</div>';
            });
          });

          show(0);
        });
      }

      const categories = ['全部', ...ALLOWED_CATEGORIES];
      filters.innerHTML = categories.map((category, index) => `
        <button class="${index === 0 ? 'active' : ''}" type="button" data-category="${category}">
          ${category}
        </button>
      `).join('');

      filters.addEventListener('click', event => {
        const button = event.target.closest('button[data-category]');
        if (!button) return;
        filters.querySelectorAll('button').forEach(item => item.classList.remove('active'));
        button.classList.add('active');
        renderAppreciations(button.dataset.category);
      });

      renderAppreciations();
    })();
  </script>
</body>
</html>
