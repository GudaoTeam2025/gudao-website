<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#262C31">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>販售登記｜孤島 GUDAO</title>
  <link rel="stylesheet" href="sale-register.css?v=2">
</head>
<body class="private-sale-page">
  <main class="register-shell">
    <header class="register-header">
      <div class="register-brand">
        <div class="register-logo">
          <img src="assets/brand/logo.png" alt="孤島標誌">
        </div>
        <div>
          <p class="eyebrow">GUDAO POP-UP SALES</p>
          <h1>現場販售登記</h1>
          <p>完成登記後，系統會保留交易編號與總金額。</p>
        </div>
      </div>
      <button id="open-admin" class="admin-entry" type="button">管理查詢</button>
    </header>

    <section id="customer-view" class="register-card" aria-labelledby="form-title">
      <div class="section-heading">
        <p class="step">STEP 01</p>
        <h2 id="form-title">購買人資料</h2>
      </div>

      <form id="sale-form" novalidate>
        <div class="buyer-grid">
          <label>
            您的名字是 <span aria-hidden="true">*</span>
            <input id="customer-name" name="customerName" type="text" maxlength="40" autocomplete="name" required placeholder="請輸入姓名">
          </label>

          <label>
            IG 帳號或 FB 名稱 <span aria-hidden="true">*</span>
            <input id="social-name" name="socialName" type="text" maxlength="80" required placeholder="例如：@gudao.team">
          </label>
        </div>

        <div class="section-heading product-heading">
          <div>
            <p class="step">STEP 02</p>
            <h2>購買商品</h2>
          </div>
          <p>可從當次商品表選擇並自動帶入金額，也可選擇「手動填寫」。</p>
        </div>

        <div id="sale-items" class="sale-items"></div>

        <button id="add-item" class="add-item" type="button" aria-label="新增一項商品">
          <span aria-hidden="true">＋</span> 新增商品
        </button>
        <p id="item-limit-note" class="field-note">預設顯示 5 項，按「新增商品」可增加第 6 項以上。</p>

        <div class="summary-box">
          <span>總金額</span>
          <strong id="grand-total">NT$ 0</strong>
        </div>

        <label class="note-field">
          備註
          <textarea id="sale-note" name="saleNote" rows="3" maxlength="300" placeholder="例如：付款方式、取貨註記或其他需要記錄的事項"></textarea>
        </label>

        <label class="confirm-check">
          <input id="confirm-data" type="checkbox" required>
          <span>已確認姓名、社群帳號、購買商品與金額皆正確。</span>
        </label>

        <p id="form-message" class="form-message" role="status" aria-live="polite"></p>

        <button class="submit-button" type="submit">完成販售登記</button>
      </form>
    </section>

    <section id="success-view" class="register-card success-view" hidden>
      <p class="step">REGISTRATION COMPLETE</p>
      <h2>登記完成</h2>
      <p>交易編號</p>
      <strong id="success-id" class="success-id"></strong>
      <p>本次總金額</p>
      <strong id="success-total" class="success-total"></strong>
      <div class="success-actions">
        <button id="new-sale" class="submit-button" type="button">登記下一筆</button>
        <button id="print-receipt" class="outline-button" type="button">列印／另存紀錄</button>
      </div>
    </section>

    <section id="admin-view" class="register-card admin-view" hidden>
      <div class="admin-toolbar">
        <div>
          <p class="step">GUDAO ADMIN</p>
          <h2>販售查詢</h2>
        </div>
        <button id="close-admin" class="outline-button" type="button">返回登記</button>
      </div>

      <div id="admin-login" class="admin-login">
        <label>
          管理 PIN
          <input id="admin-pin" type="password" inputmode="numeric" maxlength="12" placeholder="請輸入管理 PIN">
        </label>
        <button id="admin-login-button" class="submit-button" type="button">進入管理畫面</button>
        <p id="admin-login-message" class="form-message" role="status"></p>
      </div>

      <div id="admin-content" hidden>
        <div class="stats-grid">
          <div><span>交易筆數</span><strong id="stat-count">0</strong></div>
          <div><span>商品件數</span><strong id="stat-items">0</strong></div>
          <div><span>販售總額</span><strong id="stat-total">NT$ 0</strong></div>
        </div>

        <div class="admin-actions">
          <input id="admin-search" type="search" placeholder="搜尋姓名、IG／FB、商品或交易編號">
          <button id="export-csv" class="outline-button" type="button">匯出 CSV</button>
          <button id="clear-records" class="danger-button" type="button">清除全部資料</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>時間／編號</th>
                <th>購買人</th>
                <th>商品</th>
                <th>總額</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="record-list"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <template id="sale-item-template">
    <article class="sale-item">
      <div class="item-number"></div>
      <label class="product-select-label">
        商品選項
        <select class="product-select"></select>
      </label>
      <label class="manual-name-label" hidden>
        手動商品名稱
        <input class="manual-name" type="text" maxlength="80" placeholder="請輸入植株或商品名稱">
      </label>
      <label>
        金額
        <input class="item-price" type="number" min="0" max="9999999" step="1" inputmode="numeric" placeholder="0">
      </label>
      <button class="remove-item" type="button" aria-label="移除此商品">移除</button>
    </article>
  </template>

  <script src="sales-products.js?v=2"></script>
  <script src="sale-register.js?v=2"></script>
</body>
</html>
